<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f6f9;
    }
    .container {
      max-width: 500px;
      margin-top: 80px;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<div class="container">
  <h3 class="text-center mb-4">User Registration</h3>

  <form id="userForm">
    <input type="text" id="name" class="form-control mb-3" placeholder="Enter Name" required>
    <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email" required>
    
    <button class="btn btn-primary w-100">Register</button>
  </form>

  <a href="display.html" class="btn btn-success w-100 mt-3">View Users</a>
</div>

<script>
document.getElementById("userForm").addEventListener("submit", function(e){
  e.preventDefault();

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;

  let user = { name, email };

  // AJAX POST
  let xhr = new XMLHttpRequest();
  xhr.open("POST", "https://jsonplaceholder.typicode.com/posts", true);
  xhr.setRequestHeader("Content-Type", "application/json");

  xhr.onload = function() {
    if (xhr.status === 201) {

      // Save to localStorage
      let users = JSON.parse(localStorage.getItem("users")) || [];
      users.push(user);
      localStorage.setItem("users", JSON.stringify(users));

      alert("User Registered Successfully!");
      document.getElementById("userForm").reset();
    }
  };

  xhr.send(JSON.stringify(user));
});
</script>

</body>
</html>
